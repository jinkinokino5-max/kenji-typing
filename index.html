  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />

    <meta property="og:type" content="website" />

    />

    <!-- 外部ファイルを増やさないよう、favicon は SVG をそのまま埋め込む（夜空の星）。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305070d'/%3E%3Cg fill='%239fc7ff'%3E%3Crect x='7' y='3' width='2' height='10'/%3E%3Crect x='3' y='7' width='10' height='2'/%3E%3Crect x='5' y='5' width='2' height='2'/%3E%3Crect x='9' y='9' width='2' height='2'/%3E%3Crect x='9' y='5' width='2' height='2'/%3E%3Crect x='5' y='9' width='2' height='2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070d;
        display: flex;
        flex-direction: column;
        /* stretch のままにする。center にすると子が内容幅に縮み、
           ゲーム画面が横いっぱいまで広がらない。中央寄せは #stage 側で行う。 */
        align-items: stretch;
        overflow: hidden;
        font-family: "DotGothic16", "MS Gothic", monospace;
      }
      /* ゲーム画面の置き場。残りの高さをすべて使う。 */
      #stage {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 画面下の帯。ゲームのステータスバーと同じ高さ・同じ罫線。 */
      #ground {
        flex: 0 0 auto;
        width: 100%;
        box-sizing: border-box;
        padding: 6px 12px 8px;
        background: #0b0f1a;
        border-top: 2px solid #22304a;
        color: #6f7f9c;
        font-size: 16px;
        line-height: 24px;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0 16px;
        justify-content: center;
      }
      #ground h1 {
        font-size: 16px;
        font-weight: normal;
        margin: 0;
        color: #9fc7ff;
        letter-spacing: 0.06em;
      }
      #ground nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0 16px;
      }
      #ground a {
        color: #6f7f9c;
        text-decoration: none;
      }
      #ground a:hover,
      #ground a:focus-visible {
        color: #9fc7ff;
        outline: none;
      }
      /*
        仮想画面をウィンドウいっぱいまで拡大。ピクセルをぼかさない。
        画面を埋めきる倍率になったため、以前の 6px の枠は上下が切れて
        中途半端に見える。枠はやめ、まわりのほのかな光だけ残す。
      */
      #screen {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 40px rgba(80, 120, 160, 0.25);
        display: block;
      }

      /*
        このゲームはローマ字を打つため、物理キーボードが要る。
        タッチ主体の端末では遊べないので、崩れた画面を見せる前に理由を伝える。
      */
      #touch-notice {
        display: none;
        position: fixed;
        inset: 0;
        background: #05070d;
        color: #cdd7f0;
        padding: 8vw 10vw;
        box-sizing: border-box;
        flex-direction: column;
        justify-content: center;
        gap: 1.2em;
        line-height: 1.9;
        text-align: center;
      }
      #touch-notice h1 {
        font-size: 1.4rem;
        color: #9fc7ff;
        margin: 0;
        letter-spacing: 0.08em;
      }
      #touch-notice p {
        margin: 0;
        font-size: 1rem;
      }
      #touch-notice small {
        color: #6f7f9c;
        font-size: 0.85rem;
      }
      #touch-notice button {
        align-self: center;
        margin-top: 0.4em;
        padding: 0.7em 1.6em;
        font: inherit;
        color: #cdd7f0;
        background: #10182a;
        border: 1px solid #3a4a6a;
        border-radius: 6px;
      }
      /* 細かいポインタ（マウス）が無い＝タッチ端末とみなす。 */
      @media (pointer: coarse) and (hover: none) {
        #touch-notice {
          display: flex;
        }
        #screen {
          display: none;
        }
        body.force-play #touch-notice {
          display: none;
        }
        body.force-play #screen {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <main id="stage"><canvas id="screen"></canvas></main>
    <div id="touch-notice">
      <h1>KENJI TYPING</h1>
      <p>
        このゲームはローマ字を打って進みます。<br />
        パソコンのキーボードで遊んでください。
      </p>
      <small>
        外付けキーボードをつないだタブレットでも遊べます。<br />
        その場合は下のボタンから開いてください。
      </small>
      <button type="button" id="force-play">キーボードがあるので始める</button>
    </div>
    <!--
      ゲームは Canvas なのでテキストが残らない。検索エンジンにも利用者にも
      たどれる導線が要るので、画面下にドット罫線の細い帯をひとつだけ置く。
      ゲーム内のステータスバーと同じ造形なので、世界観は壊れない。
    -->
    <footer id="ground">
      <h1>KENJI TYPING｜宮沢賢治のタイピングゲーム</h1>
      <nav>
        <a href="./how-to-play/">遊び方</a>
        <a href="./tips/">打ち方のコツ</a>
        <a href="./works/">収録作品</a>
        <a href="./about/">運営者について</a>
        <a href="./contact/">お問い合わせ</a>
        <a href="./privacy/">プライバシーポリシー</a>
      </nav>
    </footer>
    <script type="module" src="/src/main.ts"></script>
    <script>
      document.getElementById("force-play").addEventListener("click", function () {
        document.body.classList.add("force-play");
      });
    </script>
  </body>
</html>
